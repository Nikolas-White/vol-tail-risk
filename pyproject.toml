[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voltail"
version = "1.0.0"
description = "Forecasting volatility and tail risk: how well do the models actually hold up? Honest walk-forward backtests of GARCH, HAR, ML and tail models with formal VaR/ES validation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nikolas White" }]
# Exact versions live in requirements.lock (what CI, Docker and the results were produced with).
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "arch>=7.0",
  "statsmodels>=0.14",
  "xgboost>=2.0",
  "pyarrow>=15",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "tabulate>=0.9",
  "yfinance>=0.2.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "black>=24", "pre-commit>=3.7", "nbformat>=5.9"]

[project.scripts]
voltail = "voltail.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"notebooks/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "slow: long-running tests (end-to-end, simulation-based)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
