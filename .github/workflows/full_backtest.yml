name: Full backtest and report

# Runs the complete pipeline on real data (GitHub runners can reach Yahoo Finance),
# regenerates reports/RESULTS.md + figures and refreshes every AUTO block in the
# README and docs, then commits the result. Trigger manually after cloning, and it
# re-runs on the 1st of every month.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: write

concurrency:
  group: full-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Tests first (never publish results from a broken build)
        run: pytest -ra -m "not slow"
      - name: make all
        run: make all
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/RESULTS.md reports/blocks.json reports/figures results/latest_forecasts.json results/eval/summary.json \
                  README.md RESUME_BULLETS.md docs/*.md data/processed/data_quality.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "results: full walk-forward backtest ($(date -u +%F))"
          git push
      - name: Upload full outputs
        uses: actions/upload-artifact@v4
        with:
          name: backtest-outputs
          path: |
            results/
            reports/
          retention-days: 30
