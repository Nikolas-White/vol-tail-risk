name: Refresh forecasts

# Weekdays after the US close: download fresh data, re-estimate every model on all
# history, and commit the small results/latest_forecasts.json that the API serves.
on:
  schedule:
    - cron: "37 23 * * 1-5"   # 23:37 UTC = after 18:00 New York all year
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Data + forecasts
        run: make data forecast
      - name: Commit results artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest_forecasts.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh next-day forecasts ($(date -u +%F))"
          git push
